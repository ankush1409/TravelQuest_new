<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelQuest - Premium Travel Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0a0a0a, #1a1a1a);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .hero-title {
            font-size: clamp(2rem, 8vw, 4rem);
            text-align: center;
            margin-bottom: 2rem;
            background: linear-gradient(135deg, #8B5CF6, #EC4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: bold;
        }
        
        .status-card {
            background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 16px;
            padding: 2rem;
            margin: 2rem 0;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        
        .premium-button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #8B5CF6, #EC4899);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
            transition: all 0.2s ease;
            display: block;
            margin: 2rem auto;
        }
        
        .premium-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
        }
        
        .feature-grid {
            display: grid;
            gap: 1rem;
            margin-top: 1.5rem;
        }
        
        .feature-item {
            padding: 1rem;
            border-radius: 8px;
            font-weight: 500;
        }
        
        .feature-1 { background: linear-gradient(135deg, #8B5CF6, #EC4899); }
        .feature-2 { background: linear-gradient(135deg, #06B6D4, #10B981); }
        .feature-3 { background: linear-gradient(135deg, #F59E0B, #EF4444); }
        .feature-4 { background: linear-gradient(135deg, #10B981, #059669); }
        
        .success-indicator {
            text-align: center;
            padding: 1.5rem;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 12px;
            margin-top: 2rem;
        }
        
        .counter-display {
            font-size: 2rem;
            color: #10B981;
            font-weight: bold;
            margin: 1rem 0;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            .premium-button {
                width: 100%;
                padding: 16px;
            }
            
            .status-card {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="hero-title">🚀 TravelQuest</h1>
        
        <div class="status-card">
            <h2 style="color: #06B6D4; margin-bottom: 1rem; text-align: center;">
                ✨ Premium UI Status
            </h2>
            <div class="feature-grid">
                <div class="feature-item feature-1">✓ Modern gradient backgrounds</div>
                <div class="feature-item feature-2">✓ Bold colors for new generation</div>
                <div class="feature-item feature-3">✓ Mobile-first responsive design</div>
                <div class="feature-item feature-4">✓ Interactive premium elements</div>
            </div>
        </div>
        
        <button class="premium-button" onclick="incrementCounter()">
            Premium Button (<span id="counter">0</span> clicks)
        </button>
        
        <div class="success-indicator">
            <h3 style="color: #10B981; margin-bottom: 0.5rem;">
                🟢 TravelQuest Premium UI Operational
            </h3>
            <p>All premium features loaded successfully</p>
        </div>
    </div>
    
    <script>
        console.log('TravelQuest: Premium UI loaded successfully');
        
        let clickCount = 0;
        function incrementCounter() {
            clickCount++;
            document.getElementById('counter').textContent = clickCount;
            console.log('Button clicked:', clickCount);
            
            if (clickCount === 1) {
                document.querySelector('.success-indicator h3').innerHTML = 
                    '🟢 Interactive Elements Working Perfectly!';
            }
        }
        
        // Add some premium animations
        document.addEventListener('DOMContentLoaded', function() {
            const cards = document.querySelectorAll('.status-card, .success-indicator');
            cards.forEach((card, index) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(20px)';
                setTimeout(() => {
                    card.style.transition = 'all 0.6s ease';
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, index * 200);
            });
        });
        
        console.log('TravelQuest: All premium features initialized');
    </script>
</body>
</html>
