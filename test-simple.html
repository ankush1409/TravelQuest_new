<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelQuest Test</title>
</head>
<body>
    <div id="root" style="padding: 20px; background: linear-gradient(135deg, #0a0a0a, #1a1a1a); color: white; min-height: 100vh; font-family: system-ui;">
        <h1 style="color: #8B5CF6; font-size: 3rem; text-align: center; background: linear-gradient(135deg, #8B5CF6, #EC4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
            🚀 TravelQuest - Premium UI Test
        </h1>
        <div style="text-align: center; margin: 2rem 0;">
            <p style="font-size: 1.2rem;">This is a direct HTML test to verify styling works</p>
            <button onclick="this.innerText='Clicked!'" style="padding: 12px 24px; background: linear-gradient(135deg, #8B5CF6, #EC4899); color: white; border: none; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);">
                Click Test
            </button>
        </div>
        <div style="background: linear-gradient(135deg, #1a1a1a, #2a2a2a); padding: 1.5rem; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.3);">
            <h3 style="color: #06B6D4;">✨ Premium UI Features:</h3>
            <div style="display: grid; gap: 0.5rem; margin-top: 1rem;">
                <div style="padding: 0.75rem; background: linear-gradient(135deg, #8B5CF6, #EC4899); border-radius: 8px;">✓ Modern gradient backgrounds</div>
                <div style="padding: 0.75rem; background: linear-gradient(135deg, #06B6D4, #10B981); border-radius: 8px;">✓ Bold colors for new generation</div>
                <div style="padding: 0.75rem; background: linear-gradient(135deg, #F59E0B, #EF4444); border-radius: 8px;">✓ Mobile-first responsive design</div>
            </div>
        </div>
    </div>
    
    <script>
        console.log('Direct HTML test page loaded successfully');
        document.body.addEventListener('click', () => {
            console.log('Page interaction working');
        });
    </script>
</body>
</html>
